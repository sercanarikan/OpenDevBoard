# OpenDevBoard: Flask API + Modern UI by default.
#
#   http://localhost:5174  -> web        (Modern UI, nginx, /api reverse proxy)
#   api                    -> Flask + SQLite sync, internal port 5000 (NOT published)
name: opendevboard

x-nginx-healthcheck: &nginx-healthcheck
  test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
  interval: 15s
  timeout: 5s
  retries: 3
  start_period: 5s

services:
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    environment:
      BIND_HOST: 0.0.0.0
      PORT: "5000"
      DEVOPS_DATA_DIR: /data
      DEVOPS_FIXTURE_MODE: ${DEVOPS_FIXTURE_MODE:-1}
      AZURE_DEVOPS_ORG_URL: ${AZURE_DEVOPS_ORG_URL:-}
      AZURE_DEVOPS_PAT: ${AZURE_DEVOPS_PAT:-}
    expose:
      - "5000"
    volumes:
      - devops_cache_data:/data
    networks:
      - devopsflow_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-5174}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - devopsflow_network
    healthcheck: *nginx-healthcheck

  prometheus:
    image: prom/prometheus:v3.15.1
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=14d
      - --storage.tsdb.retention.size=${PROMETHEUS_STORAGE_LIMIT:-2GB}
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    expose:
      - "9090"
    networks:
      - devopsflow_network
      - observability_network
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  grafana:
    image: grafana/grafana:13.3.0
    profiles: ["observability"]
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -ec
      - 'test -s /run/secrets/grafana_admin_password || { echo "GRAFANA_ADMIN_PASSWORD is required" >&2; exit 1; }; exec /run.sh'
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_HTTP_ADDR: 0.0.0.0
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
    secrets:
      - grafana_admin_password
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - observability_network
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

secrets:
  grafana_admin_password:
    environment: GRAFANA_ADMIN_PASSWORD

volumes:
  devops_cache_data:
  prometheus_data:
  grafana_data:

networks:
  devopsflow_network:
    driver: bridge
  observability_network:
    driver: bridge
