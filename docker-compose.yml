# OpenDevBoard: Flask API + Modern UI by default.
#
#   http://localhost:5174  -> web        (Modern UI, nginx, /api reverse proxy)
#   api                    -> Flask + SQLite sync, internal port 5000 (NOT published)
name: opendevboard

x-nginx-healthcheck: &nginx-healthcheck
  test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
  interval: 15s
  timeout: 5s
  retries: 3
  start_period: 5s

services:
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    environment:
      BIND_HOST: 0.0.0.0
      PORT: "5000"
      DEVOPS_DATA_DIR: /data
      DEVOPS_FIXTURE_MODE: ${DEVOPS_FIXTURE_MODE:-1}
      AZURE_DEVOPS_ORG_URL: ${AZURE_DEVOPS_ORG_URL:-}
      AZURE_DEVOPS_PAT: ${AZURE_DEVOPS_PAT:-}
    expose:
      - "5000"
    volumes:
      - devops_cache_data:/data
    networks:
      - devopsflow_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-5174}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - devopsflow_network
    healthcheck: *nginx-healthcheck

volumes:
  devops_cache_data:

networks:
  devopsflow_network:
    driver: bridge
