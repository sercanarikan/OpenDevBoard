services:
  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile
    environment:
      BIND_HOST: 0.0.0.0
      PORT: "5000"
      DEVOPS_DATA_DIR: /data
      DEVOPS_FIXTURE_MODE: "1"
      DISABLE_BACKGROUND_SYNC: "1"
      AZURE_DEVOPS_ORG_URL: ""
      AZURE_DEVOPS_PAT: ""
    expose:
      - "5000"
    volumes:
      - fixture_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1::80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  fixture_data:
