# Synthetic counters validate the Grafana HTTP error ratio and zero-traffic behavior.
rule_files: []
evaluation_interval: 1m
fuzzy_compare: true

tests:
  - name: count upstream and network failures while excluding 2xx
    interval: 1m
    input_series:
      - series: 'opendevboard_http_results_total{result="2xx"}'
        values: '0+960x5'
      - series: 'opendevboard_http_results_total{result="429"}'
        values: '0+10x5'
      - series: 'opendevboard_http_results_total{result="503"}'
        values: '0+10x5'
      - series: 'opendevboard_http_results_total{result="4xx"}'
        values: '0+5x5'
      - series: 'opendevboard_http_results_total{result="5xx"}'
        values: '0+5x5'
      - series: 'opendevboard_http_results_total{result="network"}'
        values: '0+5x5'
      - series: 'opendevboard_http_results_total{result="other"}'
        values: '0+5x5'
      - series: 'opendevboard_http_attempts_total{method="GET"}'
        values: '0+1000x5'
    promql_expr_test:
      - expr: '((sum(increase(opendevboard_http_results_total{result=~"429|503|4xx|5xx|network|other"}[5m])) or vector(0)) / clamp_min(sum(increase(opendevboard_http_attempts_total[5m])), 1)) and (sum(increase(opendevboard_http_attempts_total[5m])) > 0)'
        eval_time: 5m
        exp_samples:
          - labels: '{}'
            value: 0.04

  - name: show zero error ratio when attempts occurred without errors
    interval: 1m
    input_series:
      - series: 'opendevboard_http_attempts_total{method="GET"}'
        values: '0+100x5'
    promql_expr_test:
      - expr: '((sum(increase(opendevboard_http_results_total{result=~"429|503|4xx|5xx|network|other"}[5m])) or vector(0)) / clamp_min(sum(increase(opendevboard_http_attempts_total[5m])), 1)) and (sum(increase(opendevboard_http_attempts_total[5m])) > 0)'
        eval_time: 5m
        exp_samples:
          - labels: '{}'
            value: 0

  - name: return no series when the attempts counter is present but has no traffic
    interval: 1m
    input_series:
      - series: 'opendevboard_http_attempts_total{method="GET"}'
        values: '0+0x5'
    promql_expr_test:
      - expr: '((sum(increase(opendevboard_http_results_total{result=~"429|503|4xx|5xx|network|other"}[5m])) or vector(0)) / clamp_min(sum(increase(opendevboard_http_attempts_total[5m])), 1)) and (sum(increase(opendevboard_http_attempts_total[5m])) > 0)'
        eval_time: 5m
        exp_samples: []

  - name: suppress successful-sync age when timestamp is zero
    interval: 1m
    input_series:
      - series: opendevboard_last_successful_sync_timestamp_seconds
        values: '0+0x5'
    promql_expr_test:
      - expr: 'time() - (opendevboard_last_successful_sync_timestamp_seconds > 0)'
        eval_time: 5m
        exp_samples: []

  - name: report successful-sync age for a nonzero timestamp
    interval: 1m
    input_series:
      - series: opendevboard_last_successful_sync_timestamp_seconds
        values: '1+0x5'
    promql_expr_test:
      - expr: 'time() - (opendevboard_last_successful_sync_timestamp_seconds > 0)'
        eval_time: 5m
        exp_samples:
          - labels: '{}'
            value: 299
